packages:
  - apps/*
  - packages/*
  - tools/*
  - generators/*

catalogMode: prefer

catalog:
  '@agentclientprotocol/sdk': ^1.4.0
  "@oxlint/plugins": 1.79.0
  "@types/node": ^24
  "@types/picomatch": ^4.0.3
  chdb: ^3.3.0
  effect: ^4.0.0-rc.113
  eta: ^4.6.0
  picomatch: ^4.0.7
  typescript: ^7.0.2
  uuid: ^14.0.2
  validator: ^13.15.35
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
publicHoistPattern:
  - "*"
allowBuilds:
  chdb: true
  msgpackr-extract: true
